  notes: "Branch gate after S5 (2026-10-08, branch 4): Mac approved cleanup run 4 by name and sent \\GO at 19:47, accepting G1(a) keep Lemma 1 and report measured growth, G2(a) keep the one-run test as sufficient and report its conservatism, G3(a) report negative H in the validation section and one scoped abstract clause; 14 files removed (the two run2 archives and 12 recovered scratch files; count erratum M5.6). S5 (2026-10-08, branch 4): pair K1+O3 selected by training leave-one-out (median 0.124); seven held-out predictions frozen (SHA-256 11d2e030, recorded in the CHANGELOG before evaluation); R1.2 verdict PASS, median held-out error 0.071 (95% bootstrap CI 0.021 to 0.082), largest 0.080, no miss above 20%; all twelve pre-registered pairs would also pass (held-out medians 0.032 to 0.071); an independent recomputation agrees exactly. Measured H<0 in all 17 configurations; the one-run test has no false positive but holds in only 6 of 17. Figure 3 drawn (validation/fig3_validation.py), not yet in the manuscript. Exploratory set run after the freeze (deviation D1): frozen-pair errors 0.001 to 0.136. Branch-3 scratchpad files retained in recovered_scratchpad_branch3/ (M5.5). Branch gate after S4 (2026-10-08): ruling R3.1 adds COR v4.1 (S8) and CGR v4.1.1 (S9) after document editing is final (protocol texts in protocols/); cleanup run 3 approved by name and executed (6 files; the two A8 files kept in archive/branch1_superseded/). S4 (2026-10-08, branch 3) ran the primary matrix: 170 runs plus 20 plan-section-10 reruns; QC passes with one flagged held-out cell; held-out speedups withheld until the S5 freeze; training configurations show negative measured overhead H. S3 (2026-10-08, branch 3) built the AMReX validation harness: analysis plan v1 hashed e4c615e3 before any timed run and amendment v2 hashed cbc2f22c before any S4 timing; Advection_AmrCore patched (harness v2, 68f11783) and built in 2D and 3D; smoke and calibration runs are non-analysis data. The manuscript is unchanged at v1_3_2. v1_3_2 (2026-10-08, branch gate) adds to the AI-use statement the sentence Mac approved as ruling W0-6 (the referee panel's proposals); no other change. v1_3_1 (2026-10-08, branch gate) is a format-only z-bump for protocol compliance: FLTE ties before 71 citations and equation references, microtype, and a Figure 2 recolor (W5-16(f)); rendered word sequence unchanged apart from line breaks. v1_3_0 (2026-10-08) implements the MREP cycle findings on GATE B and C rulings: repositioning, limit corollary, latency both ways, one-run test, published-overhead bracket, Figure 2, tilted circle; see CHANGELOG. Earlier: v1_2_1 substrate re-hashed after a build-path-only edit (five citation keys standardized to Google Scholar form; rendered text verified identical by pdftotext diff). li2002local (Local time step versus locked time step, LANL 2002) could not be located online; by ruling R1.6 it is cited only through LA-UR-03-8927 and is uncited in v1_3_x. Project transferred from ChatGPT as 'amrstepping' v1.1.0 (archive/amrstepping_v1_1_0_chatgpt_package.zip, rollback anchor). Key renamed to hyman2026local per preference 7.6."
