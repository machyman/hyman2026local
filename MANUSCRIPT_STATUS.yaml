  notes: "S13 part 1 (2026-10-12, branch 11): Mac stated that he uploaded the COR archive to the repository by mistake instead of the CGR archive (M12.5 settled); no Zenodo connection; with his approval by name, the repository was reset to one commit holding hyman2026local_2026-10-12.zip (d41e7cf, 430 files, v1_7_0), replacing 63bde79 and 5ca6418; post-push check: 430/430 files byte-identical, 4/4 printed paths, gate PASS (2 MEDIUM by design, 1 LOW). Not on arXiv yet; CGR Stage B follows the posting. Branch 10 close (2026-10-12): Mac approved cleanup 2026-10-12 run 2 by name with \\GO (10:04); 3 files removed; the repository state (M12.5) is still unconfirmed. S12 (2026-10-12, branch 10): v1_7_0 credits Li and Hyman, LA-UR-06-8741 (G21 to G24); COR package, arXiv tarball and CGR archive rebuilt for v1_7_0; nothing posted or pushed by Claude. Observed 2026-10-12 (M12.5): github.com/machyman/hyman2026local is public and serves the COR v1_6_1 package contents, without the reproduce script or validation/; no arXiv listing found; to be confirmed by Mac. Branch 9 close (2026-10-12): Mac recovered Li and Hyman, LA-UR-06-8741, which derives the note's two-level formula and tests it; v1_6_1 is held from posting; rulings G21 to G24 add S12 (credit, the §3.4 correction, the citation, the accuracy sentence) in v1_7_0, with the packages rebuilt. S11 CGR v4.1.1 (2026-10-10, branch 9): repository archive hyman2026local_2026-10-10.zip (430 files, MIT license, CITATION.cff with arXiv TBD); CGR-Audit 0 CRITICAL, 0 HIGH, 0 MEDIUM, 2 LOW; CGR-FreshExtract PASS; manuscript-github source-layer gate PASS; nothing pushed. S10 COR v4.1 (2026-10-10, branch 9): Mac confirmed G12 at 13:00, so v1_6_1 replaces the AUTHOR note with the statement of responsibility and is dated October 10, 2026 (24 pp, compile clean); G18(a) covers the HIGH both S9 scorers rank first (G20); MIT license for the repository (S11). COR Phase 1 (2026-10-10, branch 9): Mac accepted the recorded state ('accept \\GO', 07:52): not submitted, not on arXiv, no GitHub repository yet, no referee reports, no companion papers; public checks agree (M10.8). S10 in progress: v1_6_1 (z-bump) moves Table 3's float above the paragraph that cites it (L8, M10.9), no word changed; the G12 attestation not given, so the COR bundle waits. Branch gate after S9 (2026-10-09, branch 8): Mac approved cleanup proposal 2026-10-09 run 3 by name (3 files: the two 2026-10-09 run 1 archives and the top-level v1_5_0 PDF, whose copy is in archive/v1_5_0/) and sent \\GO at 20:09, accepting G18(a): COR v4.1 next (S10) at the current readiness, with the S9 scorers' converged architecture and G16(b) recorded for a journal version (E-S9, E-S6); the G12 attestation not given. S9 (2026-10-09, branch 8): v1_6_0 (y-bump, 24 pp) restructures v1_5_0 under G17(b): Section 3.2 split into Growth law, Budgets for feature-following hierarchies and Agreement with earlier estimates; published overheads moved to open Section 4 (Published overheads and what the work model leaves out); an unnumbered measures table in 5.1; the Conclusions' first paragraph in three sentences; glosses of AMReX and the box-counting law. Two cold GSR scorers: STS 79 and 78, mean 78.5 (target 90 not met); diff check 1 HIGH and 2 MEDIUM fixed, follow-up clean of HIGH and MEDIUM. Registry: fig2 PNG hash set to the on-disk file (M9.4). Branch gate after S8 (2026-10-09, branch 7): Mac approved cleanup proposal 2026-10-09 run 2 by name (executed for 3 files: the two run5 archives and the top-level v1_4_1 PDF, whose copy is in archive/v1_4_1/; the two .pyc caches are under the protected validation/ and stay) and sent \\GO at 13:51, accepting G17(b), a second text-only restructuring as S9 (COR S10, CGR S11); the G12 attestation not given. S8 (2026-10-09, branch 7): v1_5_0 (y-bump, 24 pp) restructures v1_4_1 under G15(a′): abstract novelty first, decision box in Section 1, published overheads as Section 3.3, Testing the model folded into 5.1, Section 5 cut with protocol detail in Appendix A, Table A1 counterfactuals, Figure 1 redrawn; cold GSR STS 78 (target 90 not met); diff check 5 HIGH and 7 MEDIUM fixed, follow-up 2 MEDIUM fixed. Branch gate after S7 (2026-10-09, branch 6): Mac approved cleanup run 6 by name (3 files: the two run4 archives and the top-level v1_4_0 PDF, whose copy is in archive/v1_4_0/); G15 (restructuring for readiness), G16 (natural near-break-even design) and the G12 attestation not yet ruled, carried to S8 kickoff. S7 (2026-10-09, branch 6): v1_4_1 (z-bump, 22 pp) adds the AI-use sentence on Section 5 (G10), the repository URL (G11), referee 3's ten LOW items (G14) and a Section 5.3 explanation of why no one-core run came near break-even (G9 prime (a); E-S6 kept for a journal version after the injected-cost design was withdrawn as uninformative). The responsibility marker stays until Mac attests (G12). Cold GSR v3 score STS 80, below the 90 target; restructuring proposed as G15. Diff check: no HIGH or MEDIUM remain. Branch gate after S6 (2026-10-08, branch 5): Mac approved cleanup run 5 by name (3 files: the two run3 archives and the top-level v1_3_2 PDF, whose copy is in archive/v1_3_2/); E-S6 not yet ruled, carried to S7 kickoff. S6 (2026-10-08, branch 5): v1_4_0 adds Section 5, a paired test in AMReX, with Table 5 and Figure 3, and AMReX budgets on Figure 1 (rulings G4 to G8, all option (a)). Pre-specified result: the frozen model predicts held-out speedups with median error 0.071 (PASS); post hoc, the update counts alone do as well (0.073) except for points, the model misses the components, and no configuration nears break-even. Overhead: x_C (Section 2 definition) -0.42 to -0.003, negative in all 17; time-ratio y -0.11 to 0.19, positive in 12. VER role pass on the 16 S2 entries: 0 HIGH, fixes applied. Cold referees: 4 HIGH, then 2 HIGH, then none after revision. ASM bands met. Two AUTHOR markers (repository URL; responsibility statement) block arXiv posting. arXiv categories math.NA with cross-list physics.comp-ph confirmed by Mac (2026-10-08). GATE C ruling C1: run the AMReX paired validation (Plan S3-S5) before posting. S5 (2026-10-08): the pre-registered held-out test passes R1.2 (median error 0.071, 95% CI 0.021 to 0.082; no miss above 20%); the manuscript does not report it until S6. Posting remains Mac's decision."

